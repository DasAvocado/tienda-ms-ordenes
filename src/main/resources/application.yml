server:
  port: 8083

spring:
  application:
    name: ms-ordenes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    # Confirmaciones del broker + mensajes no enrutables (se registran en log; ver RabbitConfig)
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual          # ACK explicito en cada consumidor (ConfirmacionMensajes)
        default-requeue-rejected: false   # un rechazo NUNCA se reencola: va a la DLQ
        prefetch: 10

app:
  # ---- Apache Kafka: eventos de analitica (navegacion, pagos, fraude, transacciones) ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9094,localhost:9096}
    replicas: ${KAFKA_REPLICAS:3}             # factor de replicacion (1 si usas un solo broker en local)
    topicos:
      transacciones:                     # checkout, orden creada, correo enviado (antes en RabbitMQ auditoria.todos)
        nombre: pedidos360.transacciones
        particiones: 3
        retencion-ms: 2592000000         # 30 dias
        min-isr: 2
  # ---- RabbitMQ: TODOS los nombres de mensajeria de este servicio se definen aqui ----
  rabbit:
    exchange: pedidos360.events          # exchange topic compartido por todos los servicios
    dlx: pedidos360.dlx                  # dead-letter exchange (direct)
    max-reintentos: 3
    routing-keys:
      checkout: carrito.checkout         # consume
      orden-creada: orden.creada         # publica
    queues:
      checkout: ordenes.checkout
      checkout-dlq: ordenes.checkout.dlq
  azure:
    tenant-id: ${AZURE_TENANT_ID:d276cca8-e687-4f20-8984-601387d11401}
    client-id: ${AZURE_CLIENT_ID:39a9591b-35f1-4165-8cf2-667a2c643920}
  security:
    require-roles: ${REQUIRE_ROLES:true}
